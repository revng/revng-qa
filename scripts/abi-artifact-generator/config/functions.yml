  four_byte_struct_union_with_a_bigger_scalar: ["four_byte_struct a", "uint64_t b"]
  unnaturally_sized_seven_byte_union_with_a_bigger_scalar: ["unnaturally_sized_seven_byte_struct a", "UINT128_T b"]
