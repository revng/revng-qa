#
# Multi-argument tests (see README.md).
#

argument_tests:
  # These tests are simple and are very unlikely to be the only failing ones.
  # When any of them do fail, it's a good indication that something important
  # is broken (like the list of registers).

  # These make sure the presence of multiple primitives at once does not
  # break anything.
  two_32_bit_integer_arguments:
    - uint32_t
    - uint32_t
  three_32_bit_integer_arguments:
    - uint32_t
    - uint32_t
    - uint32_t
  two_64_bit_integer_arguments:
    - uint64_t
    - uint64_t
  three_64_bit_integer_arguments:
    - uint64_t
    - uint64_t
    - uint64_t
  mixed_32_64_bit_integer_arguments:
    - uint32_t
    - uint64_t
    - uint32_t
  mixed_64_32_bit_integer_arguments:
    - uint64_t
    - uint32_t
    - uint64_t

  # These make sure the presence of multiple aggregates at once does not
  # break anything.
  two_struct_arguments:
    - four_byte_struct
    - four_byte_struct
  three_struct_arguments:
    - four_byte_struct
    - four_byte_struct
    - four_byte_struct
  two_union_arguments:
    - four_byte_struct_union_with_a_smaller_scalar
    - four_byte_struct_union_with_a_smaller_scalar
  three_union_arguments:
