    - four_byte_struct
    - int64_t
  mixed_struct_32_int_64_arguments:
    - four_byte_struct
    - int64_t
    - four_byte_struct
  mixed_int_32_struct_64_arguments:
    - int32_t
    - eight_byte_struct
    - int32_t
  mixed_struct_64_int_32_arguments:
    - eight_byte_struct
    - int32_t
    - eight_byte_struct
  mixed_int_64_struct_64_arguments:
    - int64_t
    - eight_byte_struct
    - int64_t
  mixed_struct_64_int_64_arguments:
    - eight_byte_struct
    - int64_t
    - eight_byte_struct

  # These make sure a mix of primitives and huge (stack-bound) aggregates does
  # not break anything.
  mixed_int_32_huge_struct_arguments:
    - int32_t
    - huge_struct
    - int32_t
  mixed_huge_struct_int_32_arguments:
