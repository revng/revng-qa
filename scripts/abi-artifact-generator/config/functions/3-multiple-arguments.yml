  # Even bigger argument counts
  #
  # This test is not about any ABI - it is designed to detect problems with
  # the test system itself.
  #
  # There are only so many distinct small values, so 23 one-byte arguments with
  # five iterations of fresh data each make collisions essentially guaranteed.
  # This is the worst case as far as checking is concerned. If we can handle
  # this correctly - we can handle all the other cases just as well.
  #
  # Note that there are more than one test in this file to simplify debugging:
  # if only the one- and, maybe, some two-byte tests fail, the test system is
  # clearly to blame. But if the wider ones fail too, it's a strong indication
  # that something else is at play, such as the stack not being read correctly
  # or padding is miss-computed.
  lots_of_one_byte_arguments:
    - uint8_t
    - uint8_t
    - uint8_t
    - uint8_t
    - uint8_t
    - uint8_t
    - uint8_t
