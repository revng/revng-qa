    - uint8_t
    - uint8_t
    - uint8_t
    - eight_byte_struct

  apple_mixed_aggregates_on_stack:
    - one_byte_struct
    - one_byte_struct
    - two_byte_struct
  apple_reverse_mixed_aggregates_on_stack:
    - two_byte_struct
    - one_byte_struct
    - one_byte_struct
  apple_padded_mixed_aggregates_on_stack:
    - one_byte_struct
